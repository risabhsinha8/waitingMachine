<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the `--base-href` passed to `flutter build web`: "/<repo>/"
    for a GitHub Pages project site, "/" at a domain root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project your weight-loss timeline, lock in predictions, and see which one reality is actually tracking.">
  <meta name="theme-color" content="#00897B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Losertown">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Losertown</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root { --bg: #eff5f2; --ink: #00695c; --track: #cfe3dd; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161d1b; --ink: #4db6ac; --track: #2a3532; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); transition: opacity 200ms ease-out;
    }
    #loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid var(--track); border-top-color: var(--ink);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <!-- Shown while the Flutter engine downloads; removed on its first frame. -->
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div>Loading Losertown…</div>
  </div>
  <noscript>Losertown needs JavaScript to run.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
